name: ci

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The harness itself needs bwrap, opencode and a subject checkout, so CI
      # checks what can be checked without them: the code imports and the task
      # definitions are well-formed.
      - name: Byte-compile
        run: python3 -m compileall -q harness tools tasks

      - name: Task definitions load
        run: python3 -c "import sys; sys.path.insert(0, 'tasks'); from tasks import TASKS; from revision import REVISION; assert len(TASKS) == 12 and len(REVISION) == 4"

      - name: No credentials are tracked
        run: |
          if git ls-files | grep -E '(^|/)(auth-export.*\.json|opencode\.key|\.env)$'; then
            echo "::error::a credential file is tracked"
            exit 1
          fi
